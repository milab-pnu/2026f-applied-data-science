<line x1="260" y1="112" x2="218" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="260" y1="112" x2="302" y2="150" stroke="#0f172a" stroke-width="2.5"/>
<text x="230" y="134" font-size="13" fill="#64748b" text-anchor="end">예</text>
