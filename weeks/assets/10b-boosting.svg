<text x="60" y="94" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="600">4,191 g</text>
<text x="60" y="222" font-size="14" fill="#64748b" text-anchor="middle">새 펭귄의 예측</text>
<text x="60" y="246" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="600">4,191 g</text>
<text x="155" y="94" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">+ 0.5 ×</text>
