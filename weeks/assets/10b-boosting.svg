<text x="155" y="246" font-size="16" fill="#64748b" text-anchor="middle">→</text>
<text x="260" y="246" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="600">4,590 g</text>
<text x="365" y="94" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">+ 0.5 ×</text>
<text x="470" y="52" font-size="14" fill="#64748b" text-anchor="middle">둘째 트리</text>
