<text x="260" y="94" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 202.5 mm?</text>
<rect x="180.0" y="150" width="76" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="218" y="176" font-size="15" fill="#64748b" text-anchor="middle">−530 g</text>
<rect x="264.0" y="150" width="76" height="40" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
