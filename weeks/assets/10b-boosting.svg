<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="시작값에 잔차를 예측하는 트리 셋의 출력을 차례로 더하는 부스팅">
<title>시작값에 잔차를 예측하는 트리 셋의 출력을 차례로 더하는 부스팅</title><rect width="720" height="340" fill="#ffffff"/>
<text x="62" y="48" font-size="15.6" fill="#64748b" text-anchor="middle">시작값</text>
<rect x="10.0" y="62" width="104" height="50" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="62" y="93" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">4,191 g</text>
<text x="62" y="232" font-size="15.6" fill="#64748b" text-anchor="middle">새 펭귄의 예측</text>
<text x="62" y="258" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">4,191 g</text>
<text x="250" y="48" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+ 0.5 × 첫째 트리</text>
<line x1="250" y1="112" x2="207" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="250" y1="112" x2="293" y2="152" stroke="#0f172a" stroke-width="2.5"/>
<rect x="165.0" y="62" width="170" height="50" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="250" y="93" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 202.5 mm?</text>
<rect x="167.0" y="152" width="80" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="207" y="179" font-size="15.6" fill="#64748b" text-anchor="middle">−530 g</text>
<rect x="253.0" y="152" width="80" height="42" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="293" y="179" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+797 g</text>
<text x="155" y="258" font-size="16.8" fill="#64748b" text-anchor="middle">→</text>
<text x="250" y="258" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">4,590 g</text>
<text x="440" y="48" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+ 0.5 × 둘째 트리</text>
<line x1="440" y1="112" x2="397" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="440" y1="112" x2="483" y2="152" stroke="#0f172a" stroke-width="2.5"/>
<rect x="355.0" y="62" width="170" height="50" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="440" y="93" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 212.5 mm?</text>
<rect x="357.0" y="152" width="80" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="397" y="179" font-size="15.6" fill="#64748b" text-anchor="middle">−230 g</text>
<rect x="443.0" y="152" width="80" height="42" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="483" y="179" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+619 g</text>
<text x="345" y="258" font-size="16.8" fill="#64748b" text-anchor="middle">→</text>
<text x="440" y="258" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">4,899 g</text>
<text x="630" y="48" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+ 0.5 × 셋째 트리</text>
<line x1="630" y1="112" x2="587" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="630" y1="112" x2="673" y2="152" stroke="#0f172a" stroke-width="2.5"/>
<rect x="545.0" y="62" width="170" height="50" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="630" y="93" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 194.5 mm?</text>
<rect x="547.0" y="152" width="80" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="587" y="179" font-size="15.6" fill="#64748b" text-anchor="middle">−270 g</text>
<rect x="633.0" y="152" width="80" height="42" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="673" y="179" font-size="15.6" fill="#0f172a" text-anchor="middle" font-weight="600">+190 g</text>
<text x="535" y="258" font-size="16.8" fill="#64748b" text-anchor="middle">→</text>
<text x="630" y="258" font-size="16.8" fill="#0f172a" text-anchor="middle" font-weight="600">4,994 g</text>
<line x1="20" y1="210" x2="700" y2="210" stroke="#e2e8f0" stroke-width="1"/>
<text x="360.0" y="308" font-size="15.6" fill="#0f172a" text-anchor="middle">굵은 경로: 날개 길이 219 mm인 새 펭귄. 세 트리 모두 '아니오' 쪽 잎에 도착한다</text>
</svg>
