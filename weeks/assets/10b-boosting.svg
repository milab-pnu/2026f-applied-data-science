<text x="710" y="134" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">아니오</text>
<rect x="607.0" y="64" width="146" height="48" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="680" y="94" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 194.5 mm?</text>
<rect x="600.0" y="150" width="76" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="638" y="176" font-size="15" fill="#64748b" text-anchor="middle">−270 g</text>
<rect x="684.0" y="150" width="76" height="40" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="722" y="176" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">+190 g</text>
