<text x="440" y="134" font-size="13" fill="#64748b" text-anchor="end">예</text>
<text x="500" y="134" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">아니오</text>
<rect x="397.0" y="64" width="146" height="48" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="470" y="94" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">날개 ≤ 212.5 mm?</text>
<rect x="390.0" y="150" width="76" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="428" y="176" font-size="15" fill="#64748b" text-anchor="middle">−230 g</text>
<rect x="474.0" y="150" width="76" height="40" rx="8" fill="#fff7ed" stroke="#0f172a" stroke-width="2.5"/>
<text x="512" y="176" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">+619 g</text>
