<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="시작 예측에 잔차를 예측하는 트리 셋을 차례로 더하는 부스팅">
<title>시작 예측에 잔차를 예측하는 트리 셋을 차례로 더하는 부스팅</title><rect width="780" height="330" fill="#ffffff"/>
<text x="60" y="52" font-size="14" fill="#64748b" text-anchor="middle">시작</text>
