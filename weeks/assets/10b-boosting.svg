<text x="680" y="246" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="600">4,994 g</text>
<line x1="20" y1="206" x2="760" y2="206" stroke="#e2e8f0" stroke-width="1"/>
<text x="390.0" y="296" font-size="16" fill="#0f172a" text-anchor="middle">굵은 경로: 날개 길이 219 mm인 새 펭귄</text>
