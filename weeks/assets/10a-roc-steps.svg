<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="점수 네 개로 그린 ROC 계단과 AUC 0.75">
<title>점수 네 개로 그린 ROC 계단과 AUC 0.75</title>
<rect width="720" height="400" fill="#ffffff"/>
<line x1="100" x2="370" y1="330" y2="330" stroke="#e2e8f0"/>
<line x1="100" x2="100" y1="330" y2="60" stroke="#e2e8f0"/>
<text x="92.0" y="335.0" font-size="16.8" fill="#64748b" text-anchor="end">0.0</text>
<text x="100.0" y="352.0" font-size="16.8" fill="#64748b" text-anchor="middle">0.0</text>
<line x1="100" x2="370" y1="195.0" y2="195.0" stroke="#e2e8f0"/>
<line x1="235.0" x2="235.0" y1="330" y2="60" stroke="#e2e8f0"/>
<text x="92.0" y="200.0" font-size="16.8" fill="#64748b" text-anchor="end">0.5</text>
<text x="235.0" y="352.0" font-size="16.8" fill="#64748b" text-anchor="middle">0.5</text>
<line x1="100" x2="370" y1="60" y2="60" stroke="#e2e8f0"/>
<line x1="370" x2="370" y1="330" y2="60" stroke="#e2e8f0"/>
<text x="92.0" y="65.0" font-size="16.8" fill="#64748b" text-anchor="end">1.0</text>
<text x="370.0" y="352.0" font-size="16.8" fill="#64748b" text-anchor="middle">1.0</text>
<polygon points="100,330 100,195.0 235.0,195.0 235.0,60 370,60 370,330" fill="#cbd5e1" fill-opacity="0.6"/>
<line x1="100" y1="330" x2="370" y2="60" stroke="#94a3b8" stroke-dasharray="5 4"/>
<polyline fill="none" stroke="#0f172a" stroke-width="2.5" points="100,330 100,195.0 235.0,195.0 235.0,60 370,60"/>
<line x1="100" x2="370" y1="330" y2="330" stroke="#64748b"/><line x1="100" x2="100" y1="60" y2="330" stroke="#64748b"/>
<circle cx="100" cy="195.0" r="5.5" fill="#0f172a"/>
<text x="110.0" y="187.0" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="600">① 0.8</text>
<circle cx="235.0" cy="195.0" r="5.5" fill="#0f172a"/>
<text x="245.0" y="215.0" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="600">② 0.7</text>
<circle cx="235.0" cy="60" r="5.5" fill="#0f172a"/>
<text x="245.0" y="80.0" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="600">③ 0.6</text>
<circle cx="370" cy="60" r="5.5" fill="#0f172a"/>
<text x="360.0" y="80.0" font-size="16.8" fill="#0f172a" text-anchor="end" font-weight="600">④ 0.2</text>
<text x="235.0" y="270.6" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">넓이 0.75</text>
<text x="310.6" y="162.6" font-size="15.6" fill="#64748b" text-anchor="middle">무작위 순위</text>
<text x="235.0" y="378.0" font-size="18" fill="#64748b" text-anchor="middle">거짓 양성률 FP/(FP+TN)</text>
<text x="36.0" y="195.0" font-size="18" fill="#64748b" text-anchor="middle" transform="rotate(-90 36 195.0)">재현율 TP/(TP+FN)</text>
<text x="430.0" y="90.0" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="600">점수</text>
<text x="520.0" y="90.0" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="600">실제</text>
<text x="430.0" y="120.0" font-size="16.8" fill="#334155" text-anchor="start">① 0.8</text>
<text x="520.0" y="120.0" font-size="16.8" fill="#334155" text-anchor="start">양성</text>
<text x="430.0" y="150.0" font-size="16.8" fill="#334155" text-anchor="start">② 0.7</text>
<text x="520.0" y="150.0" font-size="16.8" fill="#334155" text-anchor="start">음성</text>
<text x="430.0" y="180.0" font-size="16.8" fill="#334155" text-anchor="start">③ 0.6</text>
<text x="520.0" y="180.0" font-size="16.8" fill="#334155" text-anchor="start">양성</text>
<text x="430.0" y="210.0" font-size="16.8" fill="#334155" text-anchor="start">④ 0.2</text>
<text x="520.0" y="210.0" font-size="16.8" fill="#334155" text-anchor="start">음성</text>
<line x1="430" x2="590" y1="98" y2="98" stroke="#e2e8f0"/>
<text x="430.0" y="270.0" font-size="15.6" fill="#334155" text-anchor="start">임계값을 점수 순서대로 내리면</text>
<text x="430.0" y="296.0" font-size="15.6" fill="#334155" text-anchor="start">양성 하나 → 위로 0.5</text>
<text x="430.0" y="322.0" font-size="15.6" fill="#334155" text-anchor="start">음성 하나 → 오른쪽으로 0.5</text>
<text x="430.0" y="348.0" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">넓이 = 0.5×0.5 + 0.5×1 = 0.75</text>
</svg>
