<text x="372" y="132" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">(0, 0)</text>
<text x="20" y="166" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">0.8</text>
<text x="70" y="166" font-size="15.6" fill="#eb6834" text-anchor="start">0.8</text>
<text x="202" y="166" font-size="15.6" fill="#0f172a" text-anchor="start">1</text>
