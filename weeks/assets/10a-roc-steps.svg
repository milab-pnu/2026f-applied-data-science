<text x="70" y="200" font-size="15.6" fill="#eb6834" text-anchor="start">0.8</text>
<text x="101" y="200" font-size="15.6" fill="#2a78d6" text-anchor="start">0.7</text>
<text x="202" y="200" font-size="15.6" fill="#0f172a" text-anchor="start">1</text>
