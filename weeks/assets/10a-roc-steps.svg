<text x="552" y="335" font-size="14.4" fill="#64748b" text-anchor="end">0.0</text>
<text x="680.0" y="352" font-size="14.4" fill="#64748b" text-anchor="middle">0.5</text>
<text x="552" y="215.0" font-size="14.4" fill="#64748b" text-anchor="end">0.5</text>
<text x="800" y="352" font-size="14.4" fill="#64748b" text-anchor="middle">1.0</text>
<text x="552" y="95" font-size="14.4" fill="#64748b" text-anchor="end">1.0</text>
<polyline points="560.0,330.0 560.0,210.0 680.0,210.0 680.0,90.0 800.0,90.0" fill="none" stroke="#0f172a" stroke-width="2.6"/>
<circle cx="560.0" cy="330.0" r="5.5" fill="#0f172a"/>
<text x="570" y="322" font-size="14.4" fill="#0f172a" text-anchor="start" font-weight="600">t=0.9</text>
<circle cx="560.0" cy="210.0" r="5.5" fill="#0f172a"/>
<text x="568" y="202.0" font-size="14.4" fill="#0f172a" text-anchor="start" font-weight="600">t=0.8</text>
<circle cx="680.0" cy="210.0" r="5.5" fill="#0f172a"/>
<text x="688.0" y="230.0" font-size="14.4" fill="#0f172a" text-anchor="start" font-weight="600">t=0.7</text>
<circle cx="680.0" cy="90.0" r="5.5" fill="#0f172a"/>
<text x="672.0" y="80" font-size="14.4" fill="#0f172a" text-anchor="end" font-weight="600">t=0.6</text>
<circle cx="800.0" cy="90.0" r="5.5" fill="#0f172a"/>
<text x="794" y="80" font-size="14.4" fill="#0f172a" text-anchor="end" font-weight="600">t=0.2</text>
<text x="680.0" y="277.2" font-size="14.4" fill="#0f172a" text-anchor="middle" font-weight="600">넓이 = AUC 0.75</text>
<text x="752.0" y="162.0" font-size="13.2" fill="#64748b" text-anchor="start">무작위 순위</text>
<text x="680.0" y="378" font-size="14.4" fill="#64748b" text-anchor="middle">X축: FPR = FP / (FP+TN)</text>
<text x="514" y="210.0" font-size="14.4" fill="#64748b" text-anchor="middle" transform="rotate(-90 514 210.0)">Y축: TPR = TP / (TP+FN)</text>
</svg>
