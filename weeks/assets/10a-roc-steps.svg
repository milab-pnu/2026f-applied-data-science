<text x="226" y="34" font-size="15.6" fill="#2a78d6" text-anchor="start">0.7, 0.2</text>
<text x="20" y="58" font-size="14.4" fill="#64748b" text-anchor="start">점수가 임계값 t 이상이면 양성으로 예측한다</text>
<text x="20" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">t</text>
<text x="70" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">양성으로 예측</text>
<text x="202" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">TP</text>
<text x="240" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">FP</text>
<text x="280" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">FPR</text>
<text x="326" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">TPR</text>
<text x="372" y="96" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">그래프의 점</text>
<line x1="20" y1="106" x2="470" y2="106" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="20" y="132" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">0.9</text>
