<text x="280" y="200" font-size="15.6" fill="#0f172a" text-anchor="start">0.5</text>
<text x="326" y="200" font-size="15.6" fill="#0f172a" text-anchor="start">0.5</text>
<text x="372" y="200" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">(0.5, 0.5)</text>
