<text x="372" y="268" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">(1, 1)</text>
<line x1="20" y1="282" x2="470" y2="282" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="20" y="318" font-size="14.4" fill="#64748b" text-anchor="start">TPR = TP / (실제 양성 2개)</text>
<text x="20" y="342" font-size="14.4" fill="#64748b" text-anchor="start">FPR = FP / (실제 음성 2개)</text>
<text x="20" y="366" font-size="14.4" fill="#64748b" text-anchor="start">t를 내릴수록 양성 예측이 늘어 두 값이 함께 커진다</text>
<line x1="680.0" y1="330" x2="680.0" y2="90" stroke="#e2e8f0" stroke-width="1"/>
<line x1="560" y1="210.0" x2="800" y2="210.0" stroke="#e2e8f0" stroke-width="1"/>
