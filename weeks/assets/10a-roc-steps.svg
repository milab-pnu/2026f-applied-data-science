<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="임계값별 TPR과 FPR 표와 ROC 계단">
<title>임계값별 TPR과 FPR 표와 ROC 계단</title>
<rect width="840" height="440" fill="#ffffff"/>
<text x="20" y="34" font-size="15.6" fill="#0f172a" text-anchor="start" font-weight="600">점수</text>
