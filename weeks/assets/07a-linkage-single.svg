<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 475" role="img"><rect width="600" height="475" fill="white"/><g font-family="'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><text x="26" y="28" font-size="18" fill="#172b40" text-anchor="start">단일 연결</text><text x="26" y="52" font-size="15" fill="#172b40" text-anchor="start">가장 가까운 점을 비교</text><text x="26" y="82" font-size="15" fill="#172b40" text-anchor="start">① 세 군집</text><rect x="62" y="104" width="140" height="48" rx="12" fill="none" stroke="#2563a5" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="314" y="104" width="36" height="48" rx="12" fill="none" stroke="#c35a20" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="494" y="104" width="36" height="48" rx="12" fill="none" stroke="#7b4a9b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="134" y="100" font-size="15" fill="#2563a5" text-anchor="middle">A</text><text x="332" y="100" font-size="15" fill="#c35a20" text-anchor="middle">B</text><text x="512" y="100" font-size="15" fill="#7b4a9b" text-anchor="middle">C</text><line x1="80" y1="128" x2="512" y2="128" stroke="#aab8c6" stroke-width="2" /><circle cx="80" cy="128" r="7" fill="#2563a5"/><circle cx="116" cy="128" r="7" fill="#2563a5"/><circle cx="188" cy="128" r="7" fill="#2563a5"/><circle cx="332" cy="128" r="7" fill="#c35a20"/><circle cx="512" cy="128" r="7" fill="#7b4a9b"/><text x="80" y="175" font-size="14" fill="#172b40" text-anchor="middle">0</text><text x="116" y="175" font-size="14" fill="#172b40" text-anchor="middle">1</text><text x="188" y="175" font-size="14" fill="#172b40" text-anchor="middle">3</text><text x="332" y="175" font-size="14" fill="#172b40" text-anchor="middle">7</text><text x="512" y="175" font-size="14" fill="#172b40" text-anchor="middle">12</text><text x="26" y="202" font-size="14" fill="#172b40" text-anchor="start">A–B 계산: 가장 가까운 3 ↔ 7</text><text x="26" y="235" font-size="15" fill="#172b40" text-anchor="start">② 세 쌍 비교</text><text x="26" y="264" font-size="15" fill="#176b45" text-anchor="start">A–B 거리: 4</text><text x="240" y="264" font-size="15" fill="#172b40" text-anchor="start">B–C: 5</text><text x="390" y="264" font-size="15" fill="#172b40" text-anchor="start">A–C: 9</text><text x="26" y="293" font-size="15" fill="#176b45" text-anchor="start">A–B가 가장 작다 → A와 B를 합친다</text><text x="26" y="329" font-size="15" fill="#172b40" text-anchor="start">③ 두 군집</text><rect x="62" y="348" width="288" height="48" rx="12" fill="none" stroke="#2563a5" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="494" y="348" width="36" height="48" rx="12" fill="none" stroke="#7b4a9b" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="80" y1="372" x2="512" y2="372" stroke="#aab8c6" stroke-width="2" /><circle cx="80" cy="372" r="7" fill="#2563a5"/><circle cx="116" cy="372" r="7" fill="#2563a5"/><circle cx="188" cy="372" r="7" fill="#2563a5"/><circle cx="332" cy="372" r="7" fill="#2563a5"/><circle cx="512" cy="372" r="7" fill="#7b4a9b"/><text x="80" y="421" font-size="14" fill="#172b40" text-anchor="middle">0</text><text x="116" y="421" font-size="14" fill="#172b40" text-anchor="middle">1</text><text x="188" y="421" font-size="14" fill="#172b40" text-anchor="middle">3</text><text x="332" y="421" font-size="14" fill="#172b40" text-anchor="middle">7</text><text x="512" y="421" font-size="14" fill="#172b40" text-anchor="middle">12</text><text x="26" y="452" font-size="15" fill="#172b40" text-anchor="start">A에 B를 합침  /  C는 그대로</text></g></svg>