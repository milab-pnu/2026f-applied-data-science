<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img">
  <rect width="600" height="370" fill="#fff"/>
  <g font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" fill="#172b40">
    <text x="25" y="30" font-size="16" font-weight="600">① 학습: 검은 점으로 중심 구하기</text><text x="315" y="30" font-size="16" font-weight="600">② 검증: 검은 점을 중심에 배정</text>
    <text x="25" y="55" font-size="14">학습 6개 · 검증 4개</text><text x="315" y="55" font-size="14">학습한 중심은 그대로 사용</text>
    <g stroke="#d9e1e8" stroke-width="1"><rect x="40" y="80" width="220" height="145" fill="#f9fbfc"/><rect x="330" y="80" width="220" height="145" fill="#f9fbfc"/></g>
    <g fill="#aeb8c2"><circle cx="116" cy="139" r="5"/><circle cx="66" cy="174" r="5"/><circle cx="200" cy="164" r="5"/><circle cx="245" cy="144" r="5"/></g>
    <g fill="#172b40"><circle cx="76" cy="149" r="5"/><circle cx="96" cy="134" r="5"/><circle cx="106" cy="164" r="5"/><circle cx="210" cy="139" r="5"/><circle cx="230" cy="159" r="5"/><circle cx="230" cy="124" r="5"/></g>
    <g fill="#aeb8c2"><circle cx="366" cy="149" r="5"/><circle cx="386" cy="134" r="5"/><circle cx="396" cy="164" r="5"/><circle cx="500" cy="139" r="5"/><circle cx="520" cy="159" r="5"/><circle cx="520" cy="124" r="5"/></g>
    <g stroke="#c35a20" stroke-width="1.5"><line x1="406" y1="139" x2="382.7" y2="149"/><line x1="356" y1="174" x2="382.7" y2="149"/><line x1="490" y1="164" x2="513.3" y2="140.7"/><line x1="535" y1="144" x2="513.3" y2="140.7"/></g>
    <g fill="#172b40"><circle cx="406" cy="139" r="5"/><circle cx="356" cy="174" r="5"/><circle cx="490" cy="164" r="5"/><circle cx="535" cy="144" r="5"/></g>
    <g fill="#c35a20" stroke="#fff" stroke-width="1"><path d="M92.7 140 l2.5 6 6.5 .5 -5 4 1.5 6.5 -5.5 -3.5 -5.5 3.5 1.5 -6.5 -5 -4 6.5 -.5 Z"/><path d="M223.3 131.7 l2.5 6 6.5 .5 -5 4 1.5 6.5 -5.5 -3.5 -5.5 3.5 1.5 -6.5 -5 -4 6.5 -.5 Z"/><path d="M382.7 140 l2.5 6 6.5 .5 -5 4 1.5 6.5 -5.5 -3.5 -5.5 3.5 1.5 -6.5 -5 -4 6.5 -.5 Z"/><path d="M513.3 131.7 l2.5 6 6.5 .5 -5 4 1.5 6.5 -5.5 -3.5 -5.5 3.5 1.5 -6.5 -5 -4 6.5 -.5 Z"/></g>
    <g font-size="14"><text x="25" y="252">검은 점으로 K = 2 군집을 만들고</text><text x="25" y="274">각 군집의 중심(별)을 구한다.</text><text x="315" y="252">검은 점을 가까운 중심에 배정한다.</text><text x="315" y="274">검은 점끼리 실루엣 점수를 잰다.</text></g>
    <g font-size="14"><circle cx="31" cy="315" r="5" fill="#172b40"/><text x="43" y="320">이번 단계에서 사용하는 점</text><circle cx="250" cy="315" r="5" fill="#aeb8c2"/><text x="262" y="320">이번 단계에서 쓰지 않는 점</text><text x="25" y="350" fill="#657487">두 축은 변수 두 개를 뜻하는 예시다. 주황 선은 검증 점이 배정된 중심을 가리킨다.</text></g>
  </g>
