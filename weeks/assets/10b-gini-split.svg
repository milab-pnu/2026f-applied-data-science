<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">분할 전후의 지니 불순도</title>
<desc id="desc">양성 10, 음성 10인 노드를 양성 8 음성 2와 양성 2 음성 8로 나누어 불순도가 0.50에서 0.32로 줄어든다.</desc>
<rect width="720" height="340" fill="#fff"/>
<g fill="none" stroke="#667b8b" stroke-width="2"><path d="M305 130 L200 208"/><path d="M415 130 L520 208"/></g>
<rect x="210" y="20" width="300" height="110" rx="12" fill="#eef4f9" stroke="#8aa7bd" stroke-width="2"/>
<rect x="45" y="208" width="310" height="110" rx="12" fill="#e9f5f4" stroke="#7eaca6" stroke-width="2"/>
<rect x="365" y="208" width="310" height="110" rx="12" fill="#fbf1e8" stroke="#cfa686" stroke-width="2"/>
<rect x="243" y="154" width="234" height="32" fill="#fff"/>
<g fill="#243949" font-family="sans-serif" text-anchor="middle" font-size="20"><text x="360" y="55">분할 전</text><text x="360" y="85">양성 10 · 음성 10</text><text x="360" y="114">불순도 0.50</text><text x="200" y="244">왼쪽: 양성 8 · 음성 2</text><text x="200" y="278">불순도 0.32</text><text x="520" y="244">오른쪽: 양성 2 · 음성 8</text><text x="520" y="278">불순도 0.32</text><text x="360" y="177" font-size="18">가중 평균 0.32, 감소 0.18</text></g>
</svg>
